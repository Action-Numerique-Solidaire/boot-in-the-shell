# Écrit à la racine de l'initrd (/preseed.cfg) : l'installateur le charge au
# démarrage, quelle que soit l'entrée choisie dans le menu.
#
# Il ne contient qu'un aiguillage : le vrai preseed, qui EFFACE le disque
# interne, n'est inclus que si le noyau a reçu « bits=installer », ce que seule
# l'entrée « Installer le serveur BITS » passe. L'installation manuelle reste
# donc entièrement interactive.
d-i preseed/include_command string if grep -qw bits=installer /proc/cmdline; then echo bits/preseed.cfg; fi
