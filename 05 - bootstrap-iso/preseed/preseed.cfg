# Preseed de l'ISO d'amorçage Boot in the Shell (Debian 13).
#
# Inclus UNIQUEMENT par l'entrée « Installer le serveur BITS » du menu, qui
# passe bits=installer au noyau (voir racine.cfg) : l'entrée d'installation
# manuelle n'en hérite pas, et n'efface donc rien d'elle-même.
#
# Le DISQUE INTERNE est entièrement effacé, sans question : c'est le premier
# disque qui n'est ni USB ni amovible (voir choisir-disque.sh), jamais la clé.

### Langue, clavier, fuseau
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Réseau : DHCP sur la première interface qui a du lien
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string bits
d-i netcfg/get_domain string
d-i netcfg/hostname string bits
d-i hw-detect/load_firmware boolean true

### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Comptes : root seul, mot de passe « admin » (accès de débogage demandé ;
### la console rappelle de le changer)
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password admin
d-i passwd/root-password-again password admin

### Partitionnement : disque entier, une partition, sans question
d-i partman/early_command string sh /bits/choisir-disque.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Paquets : système minimal + SSH
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect ssh-server
# ca-certificates n'est pas dans un système minimal (sans la tâche
# « standard ») : sans lui, apt refuse le dépôt BITS servi en HTTPS.
d-i pkgsel/include string ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Chargeur : sur le disque choisi (fixé par choisir-disque.sh), et copie
### au chemin EFI de repli pour les firmwares qui perdent leurs entrées.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean true

### BITS : dépôt apt, paquets, SSH root, mises à jour automatiques
d-i preseed/late_command string cp /bits/late.sh /target/root/bits-late.sh; cp /bits/bits.conf /target/root/bits.conf; in-target sh /root/bits-late.sh

### Fin : redémarrage sans question. La clé, si elle reste branchée et passe
### en premier, s'arrête sur son menu (aucun choix par défaut) : pas de
### réinstallation en boucle.
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note
