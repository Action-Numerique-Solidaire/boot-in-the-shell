# Bloc ajoute a /etc/samba/smb.conf par deploy-windows11-pxe.sh
# La section [global] contient aussi : map to guest = Bad User

# BEGIN BITS WINDOWS11
[win11]
   comment = Installation Windows 11 PXE
   path = /srv/pxe-data/windows/win11-25h2-fr
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   force user = nobody
   hosts allow = 192.168.0.0/24 127.0.0.1
   hosts deny = 0.0.0.0/0
# END BITS WINDOWS11
