port=0

interface=enp0s31f6
bind-interfaces

dhcp-range=192.168.0.0,proxy

enable-tftp
tftp-root=/srv/tftp

dhcp-userclass=set:ipxe,iPXE
dhcp-match=set:ipxe,175

dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

dhcp-boot=tag:ipxe,http://192.168.0.101/pxe/menu.ipxe
dhcp-boot=tag:!ipxe,tag:efi64,snponly.efi,,192.168.0.101
dhcp-boot=tag:!ipxe,tag:!efi64,undionly.kpxe,,192.168.0.101

pxe-prompt="Demarrage reseau T1000",0
pxe-service=tag:!ipxe,BC_EFI,"iPXE UEFI",snponly.efi,192.168.0.101
pxe-service=tag:!ipxe,X86-64_EFI,"iPXE UEFI x64",snponly.efi,192.168.0.101
pxe-service=tag:!ipxe,x86PC,"iPXE BIOS",undionly.kpxe,192.168.0.101

log-dhcp
