name: ISO live (clé USB)

# Construit l'ISO live hybride BIOS + UEFI, prête à être écrite sur une clé USB
# avec dd. Le build dure ~30 à 45 min (debootstrap complet, pas de cache de
# chroot sur un runner neuf) : il n'est donc PAS déclenché à chaque commit.
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier aussi l'ISO dans une release (sinon artefact seul)"
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # doit rester aligné sur DISTRO=noble dans build-iso.sh
    timeout-minutes: 120
    permissions:
      contents: write       # nécessaire uniquement pour créer la release sur tag
    env:
      ISO_NAME: boot-in-the-shell-live.iso

    steps:
      - uses: actions/checkout@v4

      # Le chroot (~2 Go), le squashfs et l'ISO (~1,2 Go) tiennent large une fois
      # les SDK préinstallés retirés.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Dépendances de l'hôte
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso
          # isolinux et grub-efi ne sont PAS requis ici : build-iso.sh les
          # installe dans le chroot et en extrait isohdpfx.bin.

      - name: Construire l'ISO
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "04 - live-iso"
          sudo env PXE_ISO_WORK="$RUNNER_TEMP/pxe-iso-build" \
            bash ./build-iso.sh "$GITHUB_WORKSPACE/out/$ISO_NAME"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/out/$ISO_NAME"*

      # Garde-fou : l'ISO a été BIOS seul pendant tout le mois d'octobre, ce qui
      # la rendait inutilisable sur du matériel post-2012 à CSM désactivé.
      # Un build qui régresserait sur ce point doit échouer ici, pas sur le
      # premier PC d'un bénévole.
      - name: Vérifier le catalogue El Torito (BIOS + UEFI)
        run: |
          xorriso -indev "out/$ISO_NAME" -report_el_torito plain 2>&1 | tee eltorito.txt
          imgs=$(grep 'El Torito boot img' eltorito.txt || true)
          echo "$imgs"
          echo "$imgs" | grep -q 'BIOS' || { echo "::error::entrée El Torito BIOS absente"; exit 1; }
          echo "$imgs" | grep -q 'UEFI' || { echo "::error::entrée El Torito UEFI absente"; exit 1; }

      - name: Empreinte et résumé
        run: |
          sha256sum "out/$ISO_NAME" | tee "out/$ISO_NAME.sha256"
          size=$(du -h "out/$ISO_NAME" | cut -f1)
          sum=$(cut -d' ' -f1 "out/$ISO_NAME.sha256")
          {
            echo "## ISO live construite"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`$ISO_NAME\` |"
            echo "| Taille | $size |"
            echo "| SHA-256 | \`$sum\` |"
            echo "| Démarrage | BIOS (isolinux) + UEFI (GRUB), Secure Boot **non** pris en charge |"
            echo
            echo "### Écriture sur une clé USB"
            echo '```bash'
            echo "sudo dd if=$ISO_NAME of=/dev/sdX bs=4M status=progress conv=fsync"
            echo '```'
            echo
            echo "> Vérifier \`/dev/sdX\` avec \`lsblk\` avant de lancer la commande : dd écrase le disque sans confirmation."
            echo "> Sur la machine cible, **désactiver le Secure Boot** dans le firmware."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: boot-in-the-shell-live-iso
          path: out/
          retention-days: 14
          compression-level: 0   # une ISO est déjà compressée en xz

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" \
            --title "Boot in the Shell — ISO live $tag" \
            --notes "ISO live hybride BIOS + UEFI, à écrire sur clé USB avec dd. Secure Boot non pris en charge : le désactiver dans le firmware de la machine cible." \
            --target "$GITHUB_SHA" \
            "out/$ISO_NAME" "out/$ISO_NAME.sha256" || \
          gh release upload "$tag" "out/$ISO_NAME" "out/$ISO_NAME.sha256" --clobber
