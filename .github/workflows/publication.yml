name: Publication (paquets .deb et ISO d'amorçage)

# Produit les paquets et l'ISO d'amorçage et les publie en release, une par
# tag. Le dépôt apt, lui, est publié par depot-apt.yml sur les mêmes tags.
#
# L'ISO d'amorçage installe un Debian qui tire ses paquets du dépôt du MÊME
# canal : stable pour un tag v*, test pour un tag test-*.
#
# L'ISO live n'est plus construite : son script reste dans « 04 - live-iso ».
#
# Déclenchement : un TAG fonctionne depuis N'IMPORTE QUELLE branche, y compris
# une branche de travail — GitHub exécute le workflow tel qu'il existe au
# commit tagué. C'est le seul moyen de publier avant d'avoir fusionné dans la
# branche par défaut, car « Run workflow » (workflow_dispatch) n'apparaît que
# pour les workflows présents sur celle-ci.
#
#   tag v*     -> release stable
#   tag test-* -> pré-publication (essai depuis une branche de travail)
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier en release (décocher pour un artefact seul)"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
      - 'test-*'

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write       # nécessaire pour créer la release

    steps:
      - uses: actions/checkout@v4

      # --- version ----------------------------------------------------------
      - name: Déterminer la version
        id: v
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="build-$(date -u +%Y%m%d-%H%M)"
          fi
          # Une version Debian doit commencer par un chiffre.
          case "$tag" in
            v[0-9]*) deb_version="${tag#v}"; stable="true" ;;
            *)       deb_version="0.0.0+$(date -u +%Y%m%d%H%M)"; stable="false" ;;
          esac
          {
            echo "tag=$tag"
            echo "deb_version=$deb_version"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag  version_deb=$deb_version  stable=$stable"

      # --- paquet .deb : quelques secondes ----------------------------------
      - name: Construire les paquets .deb
        run: |
          set -Eeuo pipefail
          ./packaging/build-deb.sh "${{ steps.v.outputs.deb_version }}" "$GITHUB_WORKSPACE/out" | while read -r deb; do
            echo "paquet : $deb"
            dpkg-deb -I "$deb"
          done

      - name: Vérifier les paquets .deb
        run: |
          set -Eeuo pipefail
          # Les points d'entrée doivent être présents dans chaque paquet.
          verifier() {
            local deb="$1"; shift
            for f in "$@"; do
              dpkg-deb -c "$deb" | grep -q " $f\$" \
                || { echo "::error::$f absent de $(basename "$deb")"; exit 1; }
            done
          }
          verifier out/bits-pxe-server_*.deb ./usr/sbin/bitsctl ./usr/sbin/bits-pxe-install \
            ./usr/share/bits-pxe-server/scripts/lib/common.sh ./etc/bits-pxe-server/pxe.env \
            ./usr/lib/systemd/system/bits-dnsmasq.service ./usr/lib/systemd/system/bits-sync.service
          verifier out/bits-web_*.deb ./usr/share/bits-web/bits-web.py ./usr/share/bits-web/index.html \
            ./etc/sudoers.d/bits-web ./usr/lib/systemd/system/bits-web.service
          sudo apt-get install -y --no-install-recommends lintian >/dev/null 2>&1 || true
          if command -v lintian >/dev/null; then lintian out/*.deb || true; fi

      # --- ISO d'amorçage : ~15 s de construction ----------------------------
      - name: Construire l'ISO d'amorçage
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso cpio qemu-system-x86 ovmf debian-archive-keyring
          if [ "${{ steps.v.outputs.stable }}" = "true" ]; then canal=stable; else canal=test; fi
          "05 - bootstrap-iso/build-bootstrap-iso.sh" out/bits-amorcage.iso --canal "$canal"
          rm -f out/bits-amorcage.iso.sha256   # SHA256SUMS couvre tous les fichiers
          # Variante à console série, pour le seul contrôle d'amorçage : non publiée.
          "05 - bootstrap-iso/build-bootstrap-iso.sh" "$RUNNER_TEMP/bits-amorcage-serie.iso" \
            --canal "$canal" --test --console-serie

      # Une release ne doit pas contenir une ISO qui ne démarre pas : la barre
      # d'état de l'installateur prouve firmware, chargeur, noyau et initrd.
      - name: Démarrage réel de l'ISO d'amorçage (BIOS puis UEFI)
        run: |
          set -Eeuo pipefail
          for mode in bios uefi; do
            BITS_BOOT_MARKER='1\*installer' tests/boot-test.sh "$RUNNER_TEMP/bits-amorcage-serie.iso" "$mode" 600 disque
          done

      # --- empreintes et récapitulatif --------------------------------------
      - name: Empreintes
        run: |
          set -Eeuo pipefail
          cd out
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          {
            echo "## Livrables"
            echo
            echo '| Fichier | Taille |'
            echo '|---|---|'
            for f in *; do
              [ "$f" = SHA256SUMS ] && continue
              echo "| \`$f\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # --- publication -------------------------------------------------------
      - name: Publier la release
        id: release
        if: ${{ github.ref_type == 'tag' || inputs.publier }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          STABLE: ${{ steps.v.outputs.stable }}
        run: |
          set -Eeuo pipefail
          if [ "$STABLE" = "true" ]; then
            titre="Boot in the Shell $TAG"
            flags=""
            depot=apt
          else
            titre="Boot in the Shell — essai $TAG"
            flags="--prerelease"
            depot=apt-test
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$depot/"

          notes=$(cat <<NOTES
          Livrables du serveur PXE « Boot in the Shell ».

          ## Depuis le dépôt apt (mises à jour comprises)

          \`\`\`bash
          echo "deb [trusted=yes] $base ./" | sudo tee /etc/apt/sources.list.d/bits.list
          sudo apt update && sudo apt install bits-pxe-server bits-web
          \`\`\`

          L'interface web est alors sur le port 80 du serveur.

          ## Depuis ces fichiers

          \`\`\`bash
          sudo apt install $(cd out && ls *.deb | sed 's|^|./|' | tr '\n' ' ')
          \`\`\`

          Les dépendances (dnsmasq, nginx, nfs-kernel-server…) sont tirées par apt.

          ## ISO d'amorçage : un PC entier en serveur PXE

          \`bits-amorcage.iso\` (~65 Mo) installe Debian 13 minimal sur le disque
          interne, **entièrement effacé**, puis BITS depuis le dépôt de ce canal.
          SSH root / mot de passe \`admin\`, mises à jour automatiques, adresse de
          l'interface web affichée sur la console. Le menu de la clé n'a pas de
          choix par défaut : il faut choisir l'entrée d'installation.

          \`\`\`bash
          lsblk -o NAME,SIZE,MODEL,TRAN    # la clé : TRAN = usb
          sudo dd if=bits-amorcage.iso of=/dev/sdX bs=4M conv=fsync status=progress
          \`\`\`

          ## Vérifier les empreintes

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          Commit source : \`$GITHUB_SHA\`
          NOTES
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existante : mise à jour des fichiers."
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" $flags \
              --title "$titre" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              out/*
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "[Release $TAG]($url)" >> "$GITHUB_STEP_SUMMARY"

      # Filet : si la publication est désactivée, les livrables restent
      # récupérables en artefact.
      - name: Artefact (si pas de release)
        if: ${{ steps.release.outcome == 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-in-the-shell-livrables
          path: out/
          retention-days: 14
