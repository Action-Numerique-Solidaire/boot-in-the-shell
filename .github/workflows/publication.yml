name: Publication (ISO live + paquet .deb)

# Produit les livrables et les publie en release.
#
# Déclenchement : un TAG fonctionne depuis N'IMPORTE QUELLE branche, y compris
# une branche de travail — GitHub exécute le workflow tel qu'il existe au
# commit tagué. C'est le seul moyen de publier avant d'avoir fusionné dans la
# branche par défaut, car « Run workflow » (workflow_dispatch) n'apparaît que
# pour les workflows présents sur celle-ci.
#
#   tag v*     -> release stable
#   tag test-* -> pré-publication (essai depuis une branche de travail)
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier en release (décocher pour un artefact seul)"
        type: boolean
        default: true
      construire_iso:
        description: "Construire l'ISO live (décocher pour ne produire que le .deb, ~2 min au lieu de ~40)"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
      - 'test-*'

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-24.04   # doit rester aligné sur DISTRO=noble dans build-iso.sh
    timeout-minutes: 120
    permissions:
      contents: write       # nécessaire pour créer la release
    env:
      ISO_NAME: boot-in-the-shell-live.iso

    steps:
      - uses: actions/checkout@v4

      # --- version ----------------------------------------------------------
      - name: Déterminer la version
        id: v
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="build-$(date -u +%Y%m%d-%H%M)"
          fi
          # Une version Debian doit commencer par un chiffre.
          case "$tag" in
            v[0-9]*) deb_version="${tag#v}"; stable="true" ;;
            *)       deb_version="0.0.0+$(date -u +%Y%m%d%H%M)"; stable="false" ;;
          esac
          {
            echo "tag=$tag"
            echo "deb_version=$deb_version"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag  version_deb=$deb_version  stable=$stable"

      # --- paquet .deb : quelques secondes ----------------------------------
      - name: Construire le paquet .deb
        run: |
          set -Eeuo pipefail
          deb=$(./packaging/build-deb.sh "${{ steps.v.outputs.deb_version }}" "$GITHUB_WORKSPACE/out")
          echo "paquet : $deb"
          dpkg-deb -I "$deb"

      - name: Vérifier le paquet .deb
        run: |
          set -Eeuo pipefail
          deb=$(ls out/*.deb)
          # Le point d'entrée et les scripts du pipeline doivent être présents.
          for f in ./usr/sbin/bits-pxe-install \
                   ./usr/share/bits-pxe-server/scripts/install.sh \
                   ./usr/share/bits-pxe-server/scripts/lib/common.sh \
                   ./etc/bits-pxe-server/pxe.env; do
            dpkg-deb -c "$deb" | grep -q " $f\$" \
              || { echo "::error::$f absent du paquet"; exit 1; }
          done
          sudo apt-get install -y --no-install-recommends lintian >/dev/null 2>&1 || true
          command -v lintian >/dev/null && lintian "$deb" || true

      # --- ISO live : la partie longue --------------------------------------
      - name: Libérer de l'espace disque
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.construire_iso }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Dépendances de l'hôte
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.construire_iso }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso
          # isolinux et grub-efi ne sont PAS requis ici : build-iso.sh les
          # installe dans le chroot et en extrait isohdpfx.bin.

      - name: Construire l'ISO
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.construire_iso }}
        run: |
          cd "04 - live-iso"
          sudo env PXE_ISO_WORK="$RUNNER_TEMP/pxe-iso-build" \
            bash ./build-iso.sh "$GITHUB_WORKSPACE/out/$ISO_NAME"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/out/$ISO_NAME"*

      # Garde-fou : l'ISO a été BIOS seul pendant tout le mois d'octobre, ce qui
      # la rendait inutilisable sur du matériel post-2012 à CSM désactivé. Une
      # régression doit échouer ici, pas sur le premier PC d'un bénévole.
      - name: Vérifier le catalogue El Torito (BIOS + UEFI)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.construire_iso }}
        run: |
          xorriso -indev "out/$ISO_NAME" -report_el_torito plain 2>&1 | tee eltorito.txt
          imgs=$(grep 'El Torito boot img' eltorito.txt || true)
          echo "$imgs"
          echo "$imgs" | grep -q 'BIOS' || { echo "::error::entrée El Torito BIOS absente"; exit 1; }
          echo "$imgs" | grep -q 'UEFI' || { echo "::error::entrée El Torito UEFI absente"; exit 1; }

      # --- empreintes et récapitulatif --------------------------------------
      - name: Empreintes
        run: |
          set -Eeuo pipefail
          cd out
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          {
            echo "## Livrables"
            echo
            echo '| Fichier | Taille |'
            echo '|---|---|'
            for f in *; do
              [ "$f" = SHA256SUMS ] && continue
              echo "| \`$f\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # --- publication -------------------------------------------------------
      - name: Publier la release
        id: release
        if: ${{ github.ref_type == 'tag' || inputs.publier }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          STABLE: ${{ steps.v.outputs.stable }}
        run: |
          set -Eeuo pipefail
          if [ "$STABLE" = "true" ]; then
            titre="Boot in the Shell $TAG"
            flags=""
          else
            titre="Boot in the Shell — essai $TAG"
            flags="--prerelease"
          fi

          iso_bloc="_ISO non construite pour cet essai._"
          if [ -f "out/$ISO_NAME" ]; then
            iso_bloc="| | |
          |---|---|
          | Démarrage | BIOS (isolinux) **et** UEFI (GRUB) |
          | Secure Boot | **non pris en charge** — à désactiver dans le firmware |"
          fi

          notes=$(cat <<NOTES
          Livrables du serveur PXE « Boot in the Shell ».

          ## Paquet Debian

          \`\`\`bash
          sudo apt install ./$(cd out && ls *.deb)
          sudoedit /etc/bits-pxe-server/pxe.env
          sudo bits-pxe-install --prepare-data-disk
          \`\`\`

          Les dépendances (dnsmasq, nginx, nfs-kernel-server, samba…) sont tirées par apt.

          ## ISO live

          $iso_bloc

          \`\`\`bash
          sudo dd if=$ISO_NAME of=/dev/sdX bs=4M status=progress conv=fsync
          \`\`\`

          Vérifier \`/dev/sdX\` avec \`lsblk\` au préalable : \`dd\` écrase le disque sans confirmation.

          ## Vérifier les empreintes

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          Commit source : \`$GITHUB_SHA\`
          NOTES
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existante : mise à jour des fichiers."
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" $flags \
              --title "$titre" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              out/*
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "[Release $TAG]($url)" >> "$GITHUB_STEP_SUMMARY"

      # Filet : si la publication est désactivée, les livrables restent
      # récupérables en artefact.
      - name: Artefact (si pas de release)
        if: ${{ steps.release.outcome == 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-in-the-shell-livrables
          path: out/
          retention-days: 14
          compression-level: 0
