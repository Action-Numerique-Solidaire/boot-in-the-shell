# Site nginx de Boot in the Shell (paquet bits-web).
#
#   /pxe/             fichiers de démarrage (menu iPXE, noyaux, initrd)
#   /telechargements/ images téléchargées, récupérables depuis le navigateur
#   /                 interface web, servie par bits-web.service sur 127.0.0.1:8080
#
# Il remplace le site « default » de nginx, désactivé à l'installation s'il
# n'a pas été modifié, et réactivé à la désinstallation.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    location /pxe/ {
        try_files $uri =404;
    }

    # Images téléchargées par le serveur, récupérables depuis le navigateur
    # (graver une clé sur un autre poste, par exemple). Pas de liste du
    # répertoire : seulement les fichiers dont on connaît le nom.
    location /telechargements/ {
        alias /srv/bits-data/downloads/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
