# Site nginx de Boot in the Shell (paquet bits-web).
#
#   /pxe/  fichiers de démarrage (menu iPXE, noyaux, initrd), servis directement
#   /      interface web, servie par bits-web.service sur 127.0.0.1:8080
#
# Il remplace le site « default » de nginx, désactivé à l'installation s'il
# n'a pas été modifié, et réactivé à la désinstallation.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    location /pxe/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
